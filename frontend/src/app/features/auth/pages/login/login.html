<div class="login-page">

    <cb-card>

        <h1>Cardback</h1>

        <p>Welcome back.</p>

        <form
            class="login-form"
            [formGroup]="loginForm"
            (ngSubmit)="login()">

            <input
                class="cb-input"
                type="text"
                placeholder="Username or email"
                formControlName="identifier">

            <input
                class="cb-input"
                type="password"
                placeholder="Password"
                formControlName="password">

            <cb-button type="submit">

                Login

            </cb-button>

        </form>

    </cb-card>

</div>
