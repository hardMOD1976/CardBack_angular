<div class="collection-header">

  <div class="collection-header__titles">

    <h1>
      My Collection
    </h1>

    <p>
      {{ totalFigures }} figures
    </p>

  </div>

  <div class="collection-header__actions">

    <button
      type="button"
      class="collection-header__button"
      (click)="toggleSort()">

      Sort

    </button>

    <button
      type="button"
      class="collection-header__button"
      (click)="toggleFilters()">

      Filters

    </button>

  </div>

</div>

@if (sortOpen) {

  <div class="collection-header__sort">

    <div class="collection-header__sort-field">

      <label for="collection-sort-by">
        Sort by
      </label>

      <select
        id="collection-sort-by"
        [value]="sortBy"
        (change)="onSortByChange($any($event.target).value)">

        <option value="createdAt">
          Recently added
        </option>

        <option value="condition">
          Condition
        </option>

        <option value="completeness">
          Completeness
        </option>

        <option value="packagingState">
          Packaging state
        </option>

        <option value="purchaseDate">
          Purchase date
        </option>

        <option value="purchasePrice">
          Purchase price
        </option>

        <option value="estimatedMarketValue">
          Estimated market value
        </option>

        <option value="productReleaseName">
          Product release name
        </option>

      </select>

    </div>

    <div class="collection-header__sort-field">

      <label for="collection-sort-order">
        Order
      </label>

      <select
        id="collection-sort-order"
        [value]="sortOrder"
        (change)="onSortOrderChange($any($event.target).value)">

        <option value="asc">
          Ascending
        </option>

        <option value="desc">
          Descending
        </option>

      </select>

    </div>

    <button
      type="button"
      class="collection-header__button"
      (click)="applySort()">

      Apply

    </button>

  </div>

}

@if (filtersOpen) {

  <div class="collection-header__filters">

    <div class="collection-header__filter-field">

      <label for="collection-condition">
        Condition
      </label>

      <select
        id="collection-condition"
        [value]="condition ?? ''"
        (change)="onConditionChange($any($event.target).value)">

        <option value="">
          All
        </option>

        <option value="Mint">
          Mint
        </option>

        <option value="Near Mint">
          Near Mint
        </option>

        <option value="Good">
          Good
        </option>

        <option value="Fair">
          Fair
        </option>

        <option value="Poor">
          Poor
        </option>

      </select>

    </div>

    <div class="collection-header__filter-field">

      <label for="collection-completeness">
        Completeness
      </label>

      <select
        id="collection-completeness"
        [value]="completeness ?? ''"
        (change)="onCompletenessChange($any($event.target).value)">

        <option value="">
          All
        </option>

        <option value="Complete">
          Complete
        </option>

        <option value="Incomplete">
          Incomplete
        </option>

      </select>

    </div>

    <div class="collection-header__filter-field">

      <label for="collection-packaging-state">
        Packaging state
      </label>

      <select
        id="collection-packaging-state"
        [value]="packagingState ?? ''"
        (change)="onPackagingStateChange($any($event.target).value)">

        <option value="">
          All
        </option>

        <option value="Sealed">
          Sealed
        </option>

        <option value="Opened">
          Opened
        </option>

      </select>

    </div>

    <button
      type="button"
      class="collection-header__button"
      (click)="applyFilters()">

      Apply

    </button>

    <button
      type="button"
      class="collection-header__button"
      (click)="clearFilters()">

      Clear

    </button>

  </div>

}
