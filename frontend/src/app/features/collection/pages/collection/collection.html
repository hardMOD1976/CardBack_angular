<section class="collection-page">

  <cb-collection-header
    [totalFigures]="totalFigures()"
    (sortChanged)="onSortChanged($event.sortBy, $event.sortOrder)"
    (filtersChanged)="onFiltersChanged(
      $event.condition,
      $event.completeness,
      $event.packagingState
    )">
  </cb-collection-header>

  @if (loading()) {
    <section class="loading-state">
      <p>Loading your collection...</p>
    </section>
  }

  @else if (error()) {
    <section class="error-state">
      <h2>Unable to load collection.</h2>
      <p>Please try again later.</p>
    </section>
  }

  @else if (figures().length) {
    <section class="collection-grid">
      @for (figure of figures(); track figure.id) {
        <cb-figure-card
          [figure]="figure"
          (removeOwnedFigure)="removeOwnedFigure($event)">
        </cb-figure-card>
      }
    </section>
  }

  @else {
    <section class="empty-state">
      <h2>Your collection is empty</h2>
      <p>Start adding figures to your collection.</p>
    </section>
  }

</section>
