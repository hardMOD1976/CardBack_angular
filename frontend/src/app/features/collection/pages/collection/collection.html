<cb-collection-header
  [totalFigures]="totalFigures()"
  (sortChanged)="onSortChanged($event.sortBy, $event.sortOrder)"
  (filtersClicked)="onFiltersClicked()">
</cb-collection-header>

@if (loading()) {

}

@else if (error()) {

  <p>
    Please try again later.
  </p>

}

@else if (figures().length) {

  @for (figure of figures(); track figure.id) {

    <cb-figure-card
      [figure]="figure">
    </cb-figure-card>

  }

}

@else {

  <h2>
    Your collection is empty
  </h2>

  <p>
    Start building your collection.
  </p>

}
