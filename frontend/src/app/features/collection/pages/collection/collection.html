<cb-collection-header
  [totalFigures]="totalFigures()"
  (sortChanged)="onSortChanged($event.sortBy, $event.sortOrder)"
  (filtersChanged)="onFiltersChanged(
    $event.condition,
    $event.completeness,
    $event.packagingState
  )">
</cb-collection-header>

@if (loading()) {

}

@else if (error()) {

}

@else if (figures().length) {

  @for (figure of figures(); track figure.id) {

    <cb-figure-card
      [figure]="figure">
    </cb-figure-card>

  }

}

@else {

}
