<section class="collection-page">

    <cb-collection-header
  [totalFigures]="figures.length">
</cb-collection-header>

    <section
        class="loading-state"
        *ngIf="loading">

        <p>Loading your collection...</p>

    </section>

    <section
        class="error-state"
        *ngIf="error">

        <h2>Unable to load your collection</h2>

        <p>

            Please try again later.

        </p>

    </section>

    <section
        class="collection-grid"
        *ngIf="!loading && !error && figures.length">

        <cb-figure-card
            *ngFor="let figure of figures"
            [figure]="figure">
        </cb-figure-card>

    </section>

    <section
        class="empty-state"
        *ngIf="!loading && !error && !figures.length">

        <h2>Your collection is empty</h2>

        <p>

            Start building your collection.

        </p>

    </section>

</section>
