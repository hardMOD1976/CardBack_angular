<section class="databank-page">

  <header class="page-header">

    <div>

      <h1>Databank</h1>

      <p>

        Browse every figure in the Cardback database.

      </p>

    </div>

  </header>

  @if (loading) {

    <section class="loading-state">

      Loading database...

    </section>

  }

  @else if (error) {

    <section class="error-state">

      <h2>

        Unable to load databank.

      </h2>

    </section>

  }

  @else {

    <section class="databank-grid">

      @for (figure of figures; track figure.id) {

        <cb-figure-card
          [figure]="figure">
        </cb-figure-card>

      }

    </section>

  }

</section>
