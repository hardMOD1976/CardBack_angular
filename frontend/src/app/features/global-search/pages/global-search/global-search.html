<section class="global-search">
  <header class="global-search__header">
    <div>
      <span class="global-search__eyebrow">
        Search
      </span>

      <h1 class="global-search__title">
        {{ query }}
      </h1>
    </div>
  </header>

  @if (query) {
    <div class="global-search__content">
      <p class="global-search__placeholder">
        Search results for "{{ query }}"
      </p>
    </div>
  } @else {
    <div class="global-search__empty">
      <p>
        Enter a search term to find figures, characters,
        lines and more.
      </p>
    </div>
  }
</section>
