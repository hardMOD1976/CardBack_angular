<header class="header">

  <div class="header__left">

    <span class="header__welcome">
      {{ welcomeMessage }}
    </span>

    <h2 class="header__username">
      {{ user?.username }}
    </h2>

  </div>

  <div class="header__center">

    <cb-input
      type="search"
      placeholder="Search figures..."
      [(ngModel)]="searchQuery"
      (enter)="search()">
    </cb-input>

  </div>

  <div class="header__right">

    <button
      class="header__icon"
      type="button"
      [attr.aria-label]="themeLabel"
      (click)="toggleTheme()">

      {{ themeIcon }}

    </button>

    <button
      class="header__icon"
      type="button"
      aria-label="Notifications">

      🔔

    </button>

    <button
      class="header__avatar"
      type="button"
      (click)="logout()"
      title="Logout">

      {{ userInitial }}

    </button>

  </div>

</header>
